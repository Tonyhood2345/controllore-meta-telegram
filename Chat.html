// ==========================================

<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      ::-webkit-scrollbar { display: none; }
      body { background-color: #0b141a; color: #e9edef; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .chat-bg { background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-opacity: 0.06; background-repeat: repeat; }
      textarea:focus { box-shadow: none; outline: none; }
    </style>
  </head>
  <body class="h-screen flex flex-col justify-between overflow-hidden">

    <div class="bg-[#202c33] px-4 py-3 flex items-center justify-between shadow-md flex-shrink-0 z-10 border-b border-gray-700/40">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center border border-indigo-400 text-white font-bold">
          <i class="fa-solid fa-user"></i>
        </div>
        <div>
          <h2 class="text-sm font-bold text-[#e9edef]"><?= nome ?></h2>
          <p class="text-[11px] text-[#8696a0] flex items-center gap-1">
            <span>Tel:</span> <span class="text-rose-400 font-semibold font-mono"><?= numero ?></span>
          </p>
        </div>
      </div>
      
      <div class="flex items-center gap-2 bg-[#111b21] px-3 py-1.5 rounded-full border border-gray-750">
        <span id="statusTesto" class="text-[10px] font-bold uppercase tracking-wider text-[#00a884]">DarIA Attiva 🤖</span>
        <label class="relative inline-flex items-center cursor-pointer">
          <input type="checkbox" id="toggleIA" class="sr-only peer" onchange="switchRegia()" checked>
          <div class="w-8 h-4 bg-gray-600 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-0.5 after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-[#00a884]"></div>
        </label>
      </div>
    </div>

    <div id="chatHistory" class="chat-bg bg-[#0b141a] flex-grow p-4 overflow-y-auto flex flex-col gap-2.5">
      <div class="flex justify-center items-center h-full">
        <div class="text-center">
          <i class="fa-solid fa-circle-notch fa-spin text-2xl text-[#00a884] mb-2"></i>
          <p class="text-xs text-[#8696a0] tracking-widest uppercase">Allineamento Messaggi...</p>
        </div>
      </div>
    </div>

    <div id="file-preview-area" class="bg-[#1f2c34] px-4 py-2 hidden border-t border-gray-700 flex justify-between items-center text-xs">
      <span id="file-name-display" class="text-amber-400 font-medium truncate"><i class="fa-solid fa-paperclip mr-1"></i> Documento pronto...</span>
      <button onclick="annullaAllegato()" class="text-[#8696a0] hover:text-rose-500"><i class="fa-solid fa-xmark text-sm"></i></button>
    </div>

    <div class="bg-[#202c33] p-2.5 flex items-end gap-2 flex-shrink-0 border-t border-gray-700/40 mb-safe">
      <input type="file" id="fileInput" class="hidden" onchange="rilevaFile()">
      <button onclick="document.getElementById('fileInput').click()" class="bg-transparent text-[#8696a0] hover:text-[#e9edef] p-2 text-xl transition-colors"><i class="fa-solid fa-plus"></i></button>
      
      <textarea id="messaggio" rows="1" placeholder="Scrivi un messaggio manuale..." class="w-full bg-[#2a3942] text-[#e9edef] placeholder-[#8696a0] text-sm py-2 px-4 rounded-xl resize-none max-h-24 min-h-[36px] outline-none border-none"></textarea>
      
      <button id="btn-send" onclick="inviaFlusso()" class="bg-[#00a884] text-[#111b21] h-9 w-9 rounded-full flex items-center justify-center text-sm font-bold shadow transition-transform active:scale-90 flex-shrink-0"><i class="fa-solid fa-paper-plane"></i></button>
    </div>

    <script>
      const numeroCliente = "<?= numero ?>";
      let dIAPausaStatus = false;
      let tokenSicurezza = "";

      window.onload = function() {
        // Recupero sicuro del token di sessione OTP
        const urlParams = new URLSearchParams(window.location.search);
        tokenSicurezza = urlParams.get('token') || localStorage.getItem('daria_boss_token') || '';
        
        if (!tokenSicurezza) {
          document.getElementById('chatHistory').innerHTML = `
            <div class="text-center text-xs text-rose-400 mt-24 uppercase tracking-widest font-semibold p-4">
              <i class="fa-solid fa-lock text-2xl mb-2 block text-rose-500"></i>
              Sessione Non Autorizzata.<br>Token OTP assente o scaduto.
            </div>`;
          return;
        }

        caricaCronologia();
        setInterval(caricaCronologia, 7000); // Polling ogni 7 secondi
      };

      function caricaCronologia() {
        if (!tokenSicurezza) return;
        
        // Passaggio del token aggiunto per autenticare la chiamata nel backend
        google.script.run.withSuccessHandler(function(messaggi) {
          let html = '';
          messaggi.forEach(m => {
            let isBot = (m.tipo === 'bot');
            html += `
              <div class="flex ${isBot ? 'justify-end' : 'justify-start'} w-full">
                <div class="${isBot ? 'bg-[#005c4b] text-[#e9edef]' : 'bg-[#202c33] text-[#e9edef]'} max-w-[85%] rounded-xl px-3 py-1.5 text-sm shadow-sm relative">
                  <p class="whitespace-pre-wrap leading-relaxed pr-8">${m.testo}</p>
                  <span class="text-[9px] text-white/50 absolute bottom-1 right-2">${m.tempo}</span>
                </div>
              </div>`;
          });
          
          if(html) {
            document.getElementById('chatHistory').innerHTML = html;
          } else {
            document.getElementById('chatHistory').innerHTML = '<div class="text-center text-xs text-[#8696a0] mt-24 uppercase tracking-widest font-semibold"><i class="fa-solid fa-comments border border-gray-700 p-4 rounded-full text-xl mb-3 block w-fit mx-auto text-gray-600"></i> Nessun messaggio in archivio</div>';
          }
          scrollBottom();
        }).htmlOttieniCronologia(tokenSicurezza, numeroCliente);
      }

      function scrollBottom() {
        let box = document.getElementById('chatHistory');
        box.scrollTop = box.scrollHeight;
      }

      function switchRegia() {
        if (!tokenSicurezza) return;
        let toggle = document.getElementById('toggleIA');
        let statusLabel = document.getElementById('statusTesto');
        
        if (!toggle.checked) {
          statusLabel.innerText = "Regia Manuale 🧑‍💼";
          statusLabel.className = "text-[10px] font-bold uppercase tracking-wider text-amber-500";
          dIAPausaStatus = true;
          google.script.run.htmlPrendiControllo(tokenSicurezza, numeroCliente);
        } else {
          statusLabel.innerText = "DarIA Attiva 🤖";
          statusLabel.className = "text-[10px] font-bold uppercase tracking-wider text-[#00a884]";
          dIAPausaStatus = false;
          google.script.run.htmlRiattivaDarIA(tokenSicurezza, numeroCliente);
        }
      }

      function rilevaFile() {
        let file = document.getElementById('fileInput').files[0];
        if (file) {
          document.getElementById('file-name-display').innerHTML = `<i class="fa-solid fa-paperclip mr-1"></i> File Pronto: <b>${file.name}</b>`;
          document.getElementById('file-preview-area').classList.remove('hidden');
        }
      }

      function annullaAllegato() {
        document.getElementById('fileInput').value = "";
        document.getElementById('file-preview-area').classList.add('hidden');
      }

      function inviaFlusso() {
        if (!tokenSicurezza) return;
        let msgInput = document.getElementById('messaggio');
        let fileInput = document.getElementById('fileInput');
        let btn = document.getElementById('btn-send');
        
        let testo = msgInput.value.trim();
        let file = fileInput.files[0];

        if (!testo && !file) return;

        if (!dIAPausaStatus) {
          document.getElementById('toggleIA').checked = false;
          switchRegia();
        }

        btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i>`;
        btn.disabled = true;

        if (file) {
          let reader = new FileReader();
          reader.onload = function(e) {
            let rawBase64 = e.target.result.split(',')[1];
            google.script.run.withSuccessHandler(fineFlussoInvio).htmlInviaMedia(tokenSicurezza, numeroCliente, rawBase64, file.type, file.name, testo);
          };
          reader.readAsDataURL(file);
        } else {
          google.script.run.withSuccessHandler(fineFlussoInvio).htmlInviaMessaggio(tokenSicurezza, numeroCliente, testo);
        }
      }

      function fineFlussoInvio() {
        document.getElementById('messaggio').value = "";
        annullaAllegato();
        let btn = document.getElementById('btn-send');
        btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i>`;
        btn.disabled = false;
        setTimeout(caricaCronologia, 1500);
      }
    </script>
  </body>
</html>
