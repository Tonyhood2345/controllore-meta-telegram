name: 🤖 Invio Giornaliero Social Telegram & Video Carosello Storie

on:
  schedule:
    # Esegue ogni mattina alle 07:30 UTC (08:30 / 09:30 ora italiana)
    - cron: '30 7 * * *'
  workflow_dispatch:
    inputs:
      descrizione:
        description: 'Avvio manuale condivisione mattutina (Post + Video Storie 9:16)'
        required: false
        default: 'Esecuzione manuale da GitHub Actions'

jobs:
  invio_social:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Scarica Repository
        uses: actions/checkout@v4

      - name: 🐍 Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Installa Dipendenze & FFmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install Pillow

      - name: 🌅 Esegui Condivisione Mattutina Completa (Post + Video Storie)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '9162866522:AAHMrLtOTxwujogyveQtR_UI2c_gBIgm_s0' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '1723292483' }}
        run: |
          python3 pubblica_tutto_mattina.py
