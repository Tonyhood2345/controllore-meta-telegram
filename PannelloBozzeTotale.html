// ==========================================

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cockpit Bozze — Immobiliare Giancani</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; }
    .bg-golden-hour {
      background-image: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.95)), 
                        url('https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=800&q=80');
      background-size: cover;
      background-position: center;
    }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen p-3 pb-8">

  <div class="max-w-md mx-auto">

    <div class="bg-golden-hour rounded-2xl p-5 text-center mb-5 border border-slate-800 shadow-xl relative overflow-hidden">
      <div class="absolute top-0 right-0 w-24 h-24 bg-amber-500/10 rounded-full blur-2xl"></div>
      <span class="inline-block bg-amber-500 text-slate-950 px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-wider mb-2 shadow-md">
        <i class="fa-solid fa-layer-group mr-1"></i> CONSOLE DARIA
      </span>
      <h1 class="text-xl font-black uppercase tracking-tight text-white">Cockpit Bozze Totale</h1>
      <p class="text-slate-400 text-[11px] mt-1 font-medium">Gestione unificata e sicura di sopralluoghi e contratti</p>
    </div>

    <div class="flex bg-slate-900 p-1 rounded-xl gap-1 mb-5 border border-slate-800 shadow-inner">
      <button onclick="cambiaTab('VISITE')" id="tab_VISITE" class="flex-grow flex items-center justify-center gap-2 py-3 rounded-lg text-xs font-black uppercase tracking-wider transition-all bg-amber-500 text-slate-950 shadow">
        <i class="fa-solid fa-shoe-prints text-sm"></i> Fogli Visita
      </button>
      <button onclick="cambiaTab('INCARICHI')" id="tab_INCARICHI" class="flex-grow flex items-center justify-center gap-2 py-3 rounded-lg text-xs font-black uppercase tracking-wider transition-all text-slate-400 hover:text-white">
        <i class="fa-solid fa-file-signature text-sm"></i> Incarichi
      </button>
    </div>

    <div id="loader" class="text-center py-12 text-slate-400 bg-slate-900/50 rounded-2xl border border-slate-900 mb-4">
      <i class="fa-solid fa-circle-notch fa-spin text-3xl text-amber-500 mb-3 block"></i>
      <span class="text-xs font-bold uppercase tracking-wider text-slate-300">Sincronizzazione faldoni in corso...</span>
    </div>


    <div id="sezione_VISITE" class="space-y-3">
      <div id="lista_visite" class="space-y-2"></div>
      <div id="vuoto_visite" class="hidden text-center py-8 bg-slate-900/20 rounded-xl text-slate-500 text-xs border border-dashed border-slate-800">
         <i class="fa-solid fa-folder-open text-xl mb-1 block"></i> Nessun foglio visita salvato.
      </div>
      <button onclick="nuovaVisita()" class="w-full bg-slate-900 hover:bg-slate-850 text-amber-400 border border-amber-500/20 font-black py-4 rounded-xl text-xs uppercase tracking-wider shadow-md transition-all active:scale-[0.98]">
        <i class="fa-solid fa-plus mr-1"></i> Nuovo Foglio Visita
      </button>
    </div>


    <div id="sezione_INCARICHI" class="space-y-3 hidden">
      <div class="flex gap-1.5 bg-slate-950 p-1 rounded-lg border border-slate-900">
        <button onclick="filtraIncarichi('TUTTI')"      id="f_TUTTI"      class="flex-1 py-1.5 rounded-md font-bold text-[9px] uppercase tracking-wide bg-slate-800 text-white shadow">Tutti</button>
        <button onclick="filtraIncarichi('BOZZA')"      id="f_BOZZA"      class="flex-1 py-1.5 rounded-md font-bold text-[9px] uppercase tracking-wide text-slate-400 hover:text-white">Bozze</button>
        <button onclick="filtraIncarichi('COMPLETATO')" id="f_COMPLETATO" class="flex-1 py-1.5 rounded-md font-bold text-[9px] uppercase tracking-wide text-slate-400 hover:text-white">Firma OK</button>
      </div>

      <div id="lista_incarichi" class="space-y-2"></div>
      <div id="vuoto_incarichi" class="hidden text-center py-8 bg-slate-900/20 rounded-xl text-slate-500 text-xs border border-dashed border-slate-800">
         <i class="fa-solid fa-folder-open text-xl mb-1 block"></i> Nessun incarico registrato.
      </div>
      <button onclick="nuovoIncarico()" class="w-full bg-amber-500 text-slate-950 font-black py-4 rounded-xl text-xs uppercase tracking-wider shadow-lg transition-all active:scale-[0.98]">
        <i class="fa-solid fa-plus mr-1"></i> Nuovo Incarico da Zero
      </button>
    </div>

  </div>

  <script>
    var tutteLeBozzeIncarichi = [];
    var tutteLeBozzeVisite = [];
    var filtroIncarichiAttivo = 'TUTTI';
    var WEBAPP_URL = "<?= WEBAPP_URL ?>";

    // 🏎️ AVVIO: Scarica asincronamente i dati dal foglio Google
    window.onload = function() {
      caricaDatiSincronizzati();
    };

    function caricaDatiSincronizzati() {
      // Chiamata backend per caricare gli incarichi
      google.script.run
        .withSuccessHandler(function(bozzeInc) {
          tutteLeBozzeIncarichi = bozzeInc || [];
          
          // Chiamata parallela per caricare le visite
          google.script.run
            .withSuccessHandler(function(bozzeVis) {
              tutteLeBozzeVisite = bozzeVis || [];
              
              // Spegne il caricamento e renderizza le due plance
              document.getElementById('loader').classList.add('hidden');
              renderizzaPlanciaVisite(tutteLeBozzeVisite);
              renderizzaPlanciaIncarichi(tutteLeBozzeIncarichi);
            })
            .withFailureHandler(function(err) { erroreConnessione(err); })
            .leggiBozzeVisiteComplete(); // Assicurati di avere questa funzione gemella nel .gs
        })
        .withFailureHandler(function(err) { erroreConnessione(err); })
        .leggiBozzeIncarichiComplete();
    }

    function erroreConnessione(err) {
      document.getElementById('loader').innerHTML = `
        <div class="text-rose-500 p-4 font-bold text-xs uppercase">
          <i class="fa-solid fa-triangle-exclamation text-xl mb-1 block"></i>
          Errore Connessione Cloud:<br>${err.message}
        </div>`;
    }

    // 🎛️ TAB SWITCHER LOGICO
    function cambiaTab(tabScelto) {
      var tabVisite = document.getElementById('tab_VISITE');
      var tabIncarichi = document.getElementById('tab_INCARICHI');
      var sezVisite = document.getElementById('sezione_VISITE');
      var sezIncarichi = document.getElementById('sezione_INCARICHI');

      if (tabScelto === 'VISITE') {
        tabVisite.className = "flex-grow flex items-center justify-center gap-2 py-3 rounded-lg text-xs font-black uppercase tracking-wider transition-all bg-amber-500 text-slate-950 shadow";
        tabIncarichi.className = "flex-grow flex items-center justify-center gap-2 py-3 rounded-lg text-xs font-black uppercase tracking-wider transition-all text-slate-400 hover:text-white";
        sezVisite.classList.remove('hidden');
        sezIncarichi.classList.add('hidden');
      } else {
        tabIncarichi.className = "flex-grow flex items-center justify-center gap-2 py-3 rounded-lg text-xs font-black uppercase tracking-wider transition-all bg-amber-500 text-slate-950 shadow";
        tabVisite.className = "flex-grow flex items-center justify-center gap-2 py-3 rounded-lg text-xs font-black uppercase tracking-wider transition-all text-slate-400 hover:text-white";
        sezIncarichi.classList.remove('hidden');
        sezVisite.classList.add('hidden');
      }
    }

    // 📊 RENDER 1: COSTRUISCE LA LISTA FOGLI VISITA
    function renderizzaPlanciaVisite(visite) {
      var lista = document.getElementById('lista_visite');
      var vuoto = document.getElementById('vuoto_visite');
      lista.innerHTML = '';
      
      if (!visite.length) { vuoto.classList.remove('hidden'); return; }
      vuoto.classList.add('hidden');

      visite.forEach(function(v) {
        var div = document.createElement('div');
        div.className = "bg-slate-900 border-l-4 border-amber-500 rounded-xl p-3.5 space-y-2 shadow border-y border-r border-slate-800";
        div.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <p class="text-[9px] text-slate-500 font-bold uppercase tracking-wider"><i class="fa-regular fa-clock mr-1"></i>${v.dataOra}</p>
              <p class="text-sm font-extrabold text-white uppercase tracking-tight mt-0.5">${v.cliente || 'Acquirente Anonimo'}</p>
              <p class="text-[10px] text-slate-400 font-medium mt-1"><i class="fa-solid fa-map-location-dot text-amber-500/70 mr-1"></i>${v.immobile || 'Nessun immobile'}</p>
            </div>
            <span class="bg-amber-500/10 text-amber-400 border border-amber-500/20 text-[8px] font-black px-2 py-0.5 rounded-md uppercase tracking-wider">SOPRALLUOGO</span>
          </div>
          <div class="flex gap-2 pt-1 border-t border-slate-800/50">
            <button onclick="riprendiVisita('${v.idBozza}')" class="flex-1 bg-slate-800 hover:bg-slate-750 text-white font-bold text-[10px] py-2 rounded-lg transition-all">▶️ Riprendi</button>
            <button onclick="eliminaVisita('${v.idBozza}')" class="px-3 bg-rose-950 hover:bg-rose-900 text-rose-400 font-bold text-[10px] py-2 rounded-lg transition-all"><i class="fa-solid fa-trash"></i></button>
          </div>`;
        lista.appendChild(div);
      });
    }

    // 📊 RENDER 2: COSTRUISCE LA LISTA INCARICHI CON FILTRO
    function filtraIncarichi(stato) {
      filtroIncarichiAttivo = stato;
      var bottoni = ['TUTTI', 'BOZZA', 'COMPLETATO'];
      bottoni.forEach(function(b) {
        document.getElementById('f_' + b).className = b === stato 
          ? "flex-1 py-1.5 rounded-md font-bold text-[9px] uppercase tracking-wide bg-slate-800 text-white shadow"
          : "flex-1 py-1.5 rounded-md font-bold text-[9px] uppercase tracking-wide text-slate-400 hover:text-white";
      });
      var filtrate = stato === 'TUTTI' ? tutteLeBozzeIncarichi : tutteLeBozzeIncarichi.filter(function(b){ return b.stato === stato; });
      renderizzaPlanciaIncarichi(filtrate);
    }

    function renderizzaPlanciaIncarichi(incarichi) {
      var lista = document.getElementById('lista_incarichi');
      var vuoto = document.getElementById('vuoto_incarichi');
      lista.innerHTML = '';
      
      if (!incarichi.length) { vuoto.classList.remove('hidden'); return; }
      vuoto.classList.add('hidden');

      incarichi.forEach(function(b) {
        var colore = b.stato === 'COMPLETATO' ? 'border-emerald-500' : 'border-indigo-500';
        var badge = b.stato === 'COMPLETATO'
          ? '<span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-[8px] font-black px-2 py-0.5 rounded-md uppercase tracking-wider">✅ COMPLETATO</span>'
          : '<span class="bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 text-[8px] font-black px-2 py-0.5 rounded-md uppercase tracking-wider">✏️ BOZZA</span>';

        var div = document.createElement('div');
        div.className = "bg-slate-900 border-l-4 " + colore + " rounded-xl p-3.5 space-y-2 shadow border-y border-r border-slate-800";
        div.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <p class="text-[9px] text-slate-500 font-bold uppercase tracking-wider"><i class="fa-regular fa-calendar-check mr-1"></i>${b.dataOra} — ${b.agente}</p>
              <p class="text-sm font-extrabold text-white uppercase tracking-tight mt-0.5">${b.venditori}</p>
              <p class="text-[10px] text-slate-400 font-medium mt-1"><i class="fa-solid fa-house text-slate-500 mr-1"></i>${b.indirizzo}</p>
            </div>
            ${badge}
          </div>
          <div class="flex gap-2 pt-1 border-t border-slate-800/50">
            <button onclick="riprendiBozza('${b.idBozza}')" class="flex-1 bg-slate-800 hover:bg-slate-750 text-white font-bold text-[10px] py-2 rounded-lg transition-all">▶️ Riprendi</button>
            <button onclick="eliminaBozza('${b.idBozza}')" class="px-3 bg-rose-950 hover:bg-rose-900 text-rose-400 font-bold text-[10px] py-2 rounded-lg transition-all"><i class="fa-solid fa-trash"></i></button>
          </div>`;
        lista.appendChild(div);
      });
    }

    // 🧭 AZIONI REINDIRIZZAMENTO NAVIGAZIONE
    function nuovaVisita() { window.location.href = WEBAPP_URL + "?page=visita"; }
    function nuovoIncarico() { window.location.href = WEBAPP_URL + "?page=incarico"; }
    
    function riprendiVisita(id) { window.location.href = WEBAPP_URL + "?page=visita&riprendi=" + id; }
    function riprendiBozza(id) { window.location.href = WEBAPP_URL + "?page=incarico&riprendi=" + id; }

    // 🗑️ COMANDI ELIMINAZIONE CLOUD
    function eliminaVisita(id) {
      if (!confirm("Boss, vuoi cancellare definitivamente questo foglio visita?")) return;
      google.script.run
        .withSuccessHandler(function(res) {
          if (res.successo) {
            tutteLeBozzeVisite = tutteLeBozzeVisite.filter(function(v){ return v.idBozza !== id; });
            renderizzaPlanciaVisite(tutteLeBozzeVisite);
          } else { alert("Errore durante l'eliminazione."); }
        })
        .eliminaBozzaVisita(id); // Assicurati di averla nel file .gs
    }

    function eliminaBozza(id) {
      if (!confirm("Boss, vuoi cancellare definitivamente questo incarico?")) return;
      google.script.run
        .withSuccessHandler(function(res) {
          if (res.successo) {
            tutteLeBozzeIncarichi = tutteLeBozzeIncarichi.filter(function(b){ return b.idBozza !== id; });
            filtraIncarichi(filtroIncarichiAttivo);
          } else { alert("Errore durante l'eliminazione."); }
        })
        .eliminaBozzaIncarico(id);
    }
  </script>
</body>
</html>
